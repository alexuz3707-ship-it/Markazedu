<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azizbek Turg'unboyev Academy</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; background-color: #f4f6f9; margin: 0; padding: 15px; color: #333; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 15px; }
        h2, h3, h4 { color: #0088cc; text-align: center; }
        input, select, button, textarea { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
        button { background-color: #0088cc; color: white; border: none; font-weight: bold; cursor: pointer; }
        button:hover { background-color: #006699; }
        .hidden { display: none; }
        .attendance-btn { width: 48%; display: inline-block; padding: 10px; margin: 2px 0; font-size: 14px; }
        .present { background-color: #28a745; }
        .absent { background-color: #dc3545; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: center; font-size: 14px; }
        th { background-color: #0088cc; color: white; }
    </style>
</head>
<body>

    <h2>Azizbek Turg'unboyev Academy</h2>

    <!-- ROLE TANLASH -->
    <div id="role-selection" class="card">
        <h3>Tizimga kirish</h3>
        <button onclick="showTeacherLogin()">👨‍🏫 O'qituvchi Paneli</button>
        <button onclick="showStudentLogin()">👨‍🎓 O'quvchi Paneli</button>
    </div>

    <!-- O'QITUVCHI RO'YXATDAN O'TISH / KIRISH -->
    <div id="teacher-login" class="card hidden">
        <h3 id="t-form-title">O'qituvchi Kirishi</h3>
        
        <div id="reg-fields">
            <input type="text" id="t-fullname" placeholder="Ism va Familiyangiz">
            <select id="t-subject">
                <option value="">Faningizni tanlang</option>
                <option value="Matematika">Matematika</option>
                <option value="Fizika">Fizika</option>
                <option value="Ingliz tili">Ingliz tili</option>
                <option value="Kimyo">Kimyo</option>
                <option value="Biologiya">Biologiya</option>
            </select>
        </div>

        <input type="text" id="t-login" placeholder="Login yarating">
        <input type="password" id="t-pass" placeholder="Parol yarating">
        
        <button onclick="handleTeacherAuth()">Kirish / Saqlash</button>
        <button onclick="backToMain()" style="background: #6c757d;">Orqaga</button>
    </div>

    <!-- O'QITUVCHI DASHBOARD -->
    <div id="teacher-dashboard" class="card hidden">
        <h3 id="teacher-info"></h3>
        <hr>
        <h4>Yangi O'quvchi Qo'shish</h4>
        <input type="text" id="st-name" placeholder="O'quvchi Ismi Familiyasi">
        <input type="tel" id="st-phone" placeholder="Telefon raqami (masalan: +998901234567)">
        <button onclick="addStudent()">O'quvchini Saqlash</button>

        <hr>
        <h4>Kunlik Davomat</h4>
        <div id="student-list"></div>

        <hr>
        <h4>Kunlik Vazifa Yuborish</h4>
        <textarea id="task-text" placeholder="Bugungi vazifa va ma'lumotlar..."></textarea>
        <button onclick="sendHomework()">Vazifani Joylash</button>
        
        <button onclick="logoutTeacher()" style="background: #dc3545; margin-top: 15px;">Chiqish</button>
    </div>

    <!-- O'QUVCHI LOGIN -->
    <div id="student-login" class="card hidden">
        <h3>O'quvchi Kirishi</h3>
        <input type="text" id="s-fullname" placeholder="To'liq Ismingiz Familiyangiz">
        <input type="tel" id="s-phone" placeholder="Telefon raqamingiz">
        <button onclick="loginStudent()">Tekshirish</button>
        <button onclick="backToMain()" style="background: #6c757d;">Orqaga</button>
    </div>

    <!-- O'QUVCHI DASHBOARD -->
    <div id="student-dashboard" class="card hidden">
        <h3 id="student-welcome"></h3>
        <p><b>O'qiladigan fan:</b> <span id="student-subject"></span></p>
        
        <h4>Oylik Davomat va O'zlashtirish</h4>
        <table>
            <thead>
                <tr>
                    <th>Sana</th>
                    <th>Holat</th>
                </tr>
            </thead>
            <tbody id="attendance-history"></tbody>
        </table>

        <h4>O'qituvchi Yuborgan Vazifalar</h4>
        <div id="homework-list"></div>
        <button onclick="backToMain()" style="background: #6c757d; margin-top: 15px;">Orqaga</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let teachersDB = JSON.parse(localStorage.getItem('teachersDB')) || [];
        let studentsDB = JSON.parse(localStorage.getItem('studentsDB')) || [];
        let attendanceDB = JSON.parse(localStorage.getItem('attendanceDB')) || [];
        let homeworkDB = JSON.parse(localStorage.getItem('homeworkDB')) || [];
        let currentTeacher = JSON.parse(localStorage.getItem('currentTeacher')) || null;

        function backToMain() {
            document.querySelectorAll('.card').forEach(el => el.classList.add('hidden'));
            document.getElementById('role-selection').classList.remove('hidden');
        }

        function showTeacherLogin() {
            backToMain();
            document.getElementById('role-selection').classList.add('hidden');

            if (currentTeacher) {
                openTeacherDashboard();
            } else {
                document.getElementById('teacher-login').classList.remove('hidden');
            }
        }

        function handleTeacherAuth() {
            const login = document.getElementById('t-login').value.trim();
            const pass = document.getElementById('t-pass').value.trim();
            const fullname = document.getElementById('t-fullname').value.trim();
            const subject = document.getElementById('t-subject').value;

            if (!login || !pass) {
                alert("Login va parolni kiriting!");
                return;
            }

            let existingTeacher = teachersDB.find(t => t.login === login && t.password === pass);

            if (existingTeacher) {
                currentTeacher = existingTeacher;
            } else {
                if (!fullname || !subject) {
                    alert("Birinchi marta kirishda Ism, Familiya va Fanni tanlash majburiy!");
                    return;
                }
                currentTeacher = { fullname, subject, login, password: pass };
                teachersDB.push(currentTeacher);
                localStorage.setItem('teachersDB', JSON.stringify(teachersDB));
            }

            localStorage.setItem('currentTeacher', JSON.stringify(currentTeacher));
            openTeacherDashboard();
        }

        function openTeacherDashboard() {
            document.getElementById('teacher-login').classList.add('hidden');
            document.getElementById('teacher-dashboard').classList.remove('hidden');
            document.getElementById('teacher-info').innerText = `O'qituvchi: ${currentTeacher.fullname}\nFan: ${currentTeacher.subject}`;
            renderStudentList();
        }

        function logoutTeacher() {
            localStorage.removeItem('currentTeacher');
            currentTeacher = null;
            backToMain();
        }

        function addStudent() {
            const name = document.getElementById('st-name').value.trim();
            const phone = document.getElementById('st-phone').value.trim();

            if (name && phone) {
                studentsDB.push({ name, phone, subject: currentTeacher.subject, teacher: currentTeacher.fullname });
                localStorage.setItem('studentsDB', JSON.stringify(studentsDB));
                alert("O'quvchi muvaffaqiyatli qo'shildi!");
                document.getElementById('st-name').value = '';
                document.getElementById('st-phone').value = '';
                renderStudentList();
            } else {
                alert("Ma'lumotlarni to'liq kiriting!");
            }
        }

        function renderStudentList() {
            const list = document.getElementById('student-list');
            list.innerHTML = '';
            
            let myStudents = studentsDB.filter(s => s.subject === currentTeacher.subject);

            if (myStudents.length === 0) {
                list.innerHTML = '<p style="text-align:center; color: #888;">Hali o'quvchilar qo'shilmagan</p>';
                return;
            }

            myStudents.forEach((st, idx) => {
                list.innerHTML += `
                    <div style="margin-bottom: 15px; padding: 10px; border: 1px solid #eee; border-radius: 8px;">
                        <b>${st.name}</b> (${st.phone})<br>
                        <button class="attendance-btn present" onclick="markAttendance('${st.phone}', '${st.name}', 'keldi')">✅ Keldi</button>
                        <button class="attendance-btn absent" onclick="markAttendance('${st.phone}', '${st.name}', 'kelmadi')">❌ Kelmadi</button>
                    </div>
                `;
            });
        }

        function markAttendance(phone, name, status) {
            const date = new Date().toLocaleDateString();

            attendanceDB.push({ phone, date, status });
            localStorage.setItem('attendanceDB', JSON.stringify(attendanceDB));

            tg.sendData(JSON.stringify({
                action: 'attendance_notification',
                full_name: name,
                phone: phone,
                status: status
            }));

            alert(`Davomat belgilandi: ${status.toUpperCase()}`);
        }

        function sendHomework() {
            const task = document.getElementById('task-text').value.trim();
            if (task) {
                homeworkDB.push({ subject: currentTeacher.subject, task, date: new Date().toLocaleDateString() });
                localStorage.setItem('homeworkDB', JSON.stringify(homeworkDB));
                alert("Vazifa muvaffaqiyatli saqlandi!");
                document.getElementById('task-text').value = '';
            } else {
                alert("Vazifa matnini kiriting!");
            }
        }

        function showStudentLogin() {
            backToMain();
            document.getElementById('role-selection').classList.add('hidden');
            document.getElementById('student-login').classList.remove('hidden');
        }

        function loginStudent() {
            const phone = document.getElementById('s-phone').value.trim();
            const student = studentsDB.find(s => s.phone === phone);

            if (student) {
                document.getElementById('student-welcome').innerText = `Xush kelibsiz, ${student.name}!`;
                document.getElementById('student-subject').innerText = student.subject;

                const attList = document.getElementById('attendance-history');
                attList.innerHTML = '';
                let myAtt = attendanceDB.filter(a => a.phone === phone);
                
                if(myAtt.length === 0) {
                    attList.innerHTML = '<tr><td colspan="2">Hali davomat belgilanmagan</td></tr>';
                } else {
                    myAtt.forEach(a => {
                        attList.innerHTML += `<tr><td>${a.date}</td><td>${a.status === 'keldi' ? '✅ Keldi' : '❌ Kelmadi'}</td></tr>`;
                    });
                }

                const hwList = document.getElementById('homework-list');
                hwList.innerHTML = '';
                let myHw = homeworkDB.filter(h => h.subject === student.subject);
                
                if(myHw.length === 0) {
                    hwList.innerHTML = '<p style="color:#888;">Vazifalar yo\'q</p>';
                } else {
                    myHw.forEach(h => {
                        hwList.innerHTML += `<p>📌 <b>${h.date}:</b> ${h.task}</p>`;
                    });
                }

                document.getElementById('student-login').classList.add('hidden');
                document.getElementById('student-dashboard').classList.remove('hidden');
            } else {
                alert("Ushbu telefon raqami bazada topilmadi! O'qituvchingizdan sizni tizimga qo'shishini so'rang.");
            }
        }
    </script>
</body>
            </html>
